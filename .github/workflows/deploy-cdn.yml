name: Refresh and deploy CDN

on:
    schedule:
        - cron: "17 5 * * 0"
    workflow_dispatch:
        inputs:
            dry_run:
                description: Build and validate deployment without publishing
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: deploy-cdn
    cancel-in-progress: false

jobs:
    refresh-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Lint TypeScript and JavaScript
              run: yarn lint
            - name: Check TypeScript, JavaScript, JSON, YAML, and Markdown formatting
              run: yarn format:check
            - name: Check Rust formatting
              run: moon run fandom-scraper-v2:format
            - name: Lint Rust
              run: moon run fandom-scraper-v2:lint
            - name: Build scraper
              run: moon run fandom-scraper-v2:build
            - name: Run weekly scrape
              working-directory: apps/fandom-scraper-v2
              run: ./target/release/fandom-scraper-v2 --strict
              env:
                  # Bound glibc arena fragmentation during the full image batch.
                  MALLOC_ARENA_MAX: "2"
            - name: Deploy generated assets to Cloudflare
              working-directory: apps/fandom-scraper-v2
              run: |
                  args=()
                  if [[ "${ACT:-false}" == "true" || "$DEPLOY_DRY_RUN" == "true" ]]; then
                    args+=(--dry-run)
                  fi
                  yarn wrangler deploy "${args[@]}"
              env:
                  DEPLOY_DRY_RUN: ${{ inputs.dry_run || false }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
