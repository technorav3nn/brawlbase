name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup
            - name: Lint TypeScript and JavaScript
              run: yarn lint
            - name: Check TypeScript, JavaScript, JSON, YAML, and Markdown formatting
              run: yarn format:check
            - name: Check Rust formatting
              run: moon run fandom-scraper-v2:format
            - name: Lint Rust
              run: moon run fandom-scraper-v2:lint
            - name: Typecheck web app
              run: moon run web:typecheck
            - name: Test Rust scraper
              run: moon run fandom-scraper-v2:test
