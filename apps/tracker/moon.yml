layer: "library"
dependsOn: ["brawl-stars-api", "supercell-api-utils"]
tasks:
    build:
        command: "yarn build"
        deps: ["^:build"]
        inputs: ["src/**/*", "tsdown.config.ts", "tsconfig.json"]
        outputs: ["dist/**/*"]
    bundle:
        command: "yarn bundle"
        deps: ["build"]
    typecheck:
        command: "yarn typecheck"
        deps: ["^:build"]
    dev:
        command: "yarn dev"
        deps: ["^:build"]
        preset: "server"
