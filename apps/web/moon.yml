layer: "application"
dependsOn:
    - "brawl-stars-api"
    - "tracker"

workspace:
    inheritedTasks:
        exclude: ["typecheck"]

fileGroups:
    app:
        - "nuxt.config.*"
        - "wrangler.jsonc"
        - "i18n/**/*"
    sources:
        - "app/**/*"
        - "content/**/*"
        - "server/**/*"
        - "shared/**/*"
        - "public/**/*"

tasks:
    nuxt:
        command: "nuxt"
        preset: "server"

    build:
        deps:
            - "^:build"
        command: "nuxt build"
        inputs:
            - "@group(app)"
            - "@group(sources)"
        outputs:
            - ".nuxt"
            - ".output"

    dev:
        command: "nuxt dev"
        inputs:
            - "@group(app)"
            - "@group(sources)"
        preset: "server"

    preview:
        command: "nuxt preview"
        inputs:
            - "@group(app)"
            - "@group(sources)"
        deps:
            - "build"
        preset: "server"

    typecheck:
        command: "nuxt typecheck"
        deps:
            - "^:build"
        inputs:
            - "@group(app)"
            - "@group(sources)"
            - "tsconfig.json"
            - "tsconfig.*.json"

    # Extends the top-level lint
    # lint:
    #   args:
    #     - '--ext'
    #     - '.ts,.vue'
    #   deps:
    #     - 'build' # Requires built TS files
